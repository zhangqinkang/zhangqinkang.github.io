    }
    failed.clear();
  },{once:true});

    window.removeEventListener('error',remember,true);
  });
})();

    state.loading = true;
    const original = new Image();
    original.src = state.source;
    original.decode().then(() => {

      // Keep the complete preview if the original is temporarily unavailable.
      // Re-entering the viewport will retry it.

    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      restore(entry.target);
    }

  function display(image) {
    if (image.srcset || (image.complete && image.naturalWidth)) return;

    const preview = url.origin === location.origin && previews[url.pathname];
    if (!preview) return;
    pending.set(image, { source, preview, loading: false });
    image.dataset.portfolioInlineSrc = url.pathname;
    image.loading = 'eager';
    image.src = preview;
    visible.observe(image);
  }

    for (const record of records) {
      if (record.type === 'attributes' && record.target instanceof HTMLImageElement) display(record.target);
      for (const node of record.addedNodes) {

        if (node instanceof HTMLImageElement) display(node);

addEventListener('DOMContentLoaded',()=>{
  const routes=navigator.serviceWorker;
  const warmDocuments=()=>{
    for(const href of ['/hk/overview','/hk/rulebook']){
      const link=document.createElement('link');
      link.rel='prefetch';
      link.href=href;
      document.head.appendChild(link);
    }
  };

  else routes?.addEventListener('controllerchange',warmDocuments,{once:true});
  if(!matchMedia('(max-width:820px)').matches)return;
  const warm=()=>fetch('/projects/tqx/aura/mobile-motion.webm',{cache:'force-cache',priority:'low'})
    .then(response=>response.ok?response.blob():null)
    .then(blob=>{if(blob?.size)window.__portfolioTqxAuraURL=URL.createObjectURL(blob)}).catch(()=>{});
  if(window.requestIdleCallback)requestIdleCallback(warm,{timeout:1200});
  else setTimeout(warm,300);
},{once:true});
</script></head>
