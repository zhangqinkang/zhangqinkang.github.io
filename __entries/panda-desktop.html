  <script>
(() => {
  const paths=["/reference-sites/motionsites/loop-video/8d8791b3d761742d5c-400.mp4", "/reference-sites/motionsites/loop-video/476e98763a4a990f9f-400.mp4", "/reference-sites/motionsites/loop-video/42acda8c9c9660515e-400.mp4"];
  const clips=new Map();
  window.__portfolioReferenceClip=path=>{
    if(!paths.includes(path))return;
    if(!clips.has(path)){
      const download=fetch(path,{cache:'force-cache',priority:'low'})
        .then(response=>response.ok?response.blob():null)
        .then(blob=>blob?.size?URL.createObjectURL(blob):null)
        .catch(()=>null);
      clips.set(path,download);
    }
    return clips.get(path);
  };
  addEventListener('DOMContentLoaded',()=>{
    const warm=()=>paths.forEach(window.__portfolioReferenceClip);
    if(window.requestIdleCallback)requestIdleCallback(warm,{timeout:1000});
    else setTimeout(warm,200);
  },{once:true});
})();
</script></head>
