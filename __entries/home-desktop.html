  <head><script>
(() => {
  const serviceWorker=navigator.serviceWorker;
  if(!serviceWorker||serviceWorker.controller)return;
  const failed=new Set();
  const remember=event=>{
    const media=event.target;
    if(media instanceof HTMLImageElement&&media.src.startsWith(location.origin+'/'))failed.add(media);
  };
  window.addEventListener('error',remember,true);
  serviceWorker.addEventListener('controllerchange',()=>{
    window.removeEventListener('error',remember,true);
    for(const image of failed){
      if(!image.isConnected)continue;
      const current=new URL(image.currentSrc||image.src);
      current.searchParams.set('portfolio-asset-retry','1');
      image.src=current.href;
    }
    failed.clear();
  },{once:true});
  serviceWorker.register('/_pages-worker.js',{scope:'/'}).catch(()=>{
    window.removeEventListener('error',remember,true);
  });
})();
</script>

  const previews = JSON.parse(document.getElementById('portfolio-inline-art').textContent);
  const pending = new WeakMap();
  const restored = new WeakMap();
  const readyPreviews = new Set();
  for (const [path, uri] of Object.entries(previews)) {
    const image = new Image();
    image.src = uri;
    image.decode().then(() => readyPreviews.add(path), () => {});
  }

  function select(image, state) {
    if (state.sizes) image.sizes = state.sizes;
    if (state.srcset) image.srcset = state.srcset;
    image.src = state.source;
  }

  function restore(image) {
    const state = pending.get(image);
    if (!state || state.loading) return;
    state.loading = true;
    const original = new Image();
    select(original, state);
    original.decode().then(() => {
      if (pending.get(image) !== state || image.getAttribute('src') !== state.preview) return;
      pending.delete(image);
      restored.set(image, state.source);
      visible.unobserve(image);
      const priorBackground = image.style.background;
      const paintPreview = readyPreviews.has(state.path);
      if (paintPreview) {
        image.style.background = `url("${state.preview}") center / 100% 100% no-repeat${priorBackground ? `, ${priorBackground}` : ''}`;
        image.dataset.portfolioPreviewPaint = 'true';
      }
      const finish = () => {
        if (image.getAttribute('src') === state.source &&
            (image.currentSrc.startsWith('data:') || !image.complete || !image.naturalWidth)) return;
        image.removeEventListener('load', finish);
        if (image.dataset.portfolioInlineSrc !== state.path) return;
        if (paintPreview) image.style.background = priorBackground;
        delete image.dataset.portfolioInlineSrc;
        delete image.dataset.portfolioPreviewPaint;
      };
      image.addEventListener('load', finish);
      select(image, state);
      finish();
    }, () => {
      state.loading = false;
      // Keep the complete preview if the original is temporarily unavailable.
      // Re-entering the viewport will retry it.
    });
  }

  const visible = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      restore(entry.target);
    }
  }, { rootMargin: '900px 0px' });

  function display(image) {
    if (image.complete && image.naturalWidth) return;
    const source = image.getAttribute('src');
    if (!source || source.startsWith('data:') || restored.get(image) === source) return;
    const url = new URL(source, document.baseURI);
    const preview = url.origin === location.origin && previews[url.pathname];
    if (!preview) return;
    const { srcset, sizes } = image;
    pending.set(image, { source, preview, srcset, sizes, path: url.pathname, loading: false });
    image.dataset.portfolioInlineSrc = url.pathname;
    image.loading = 'eager';
    if (srcset) image.removeAttribute('srcset');
    image.src = preview;
    visible.observe(image);
  }

  new MutationObserver(records => {
    for (const record of records) {
      if (record.type === 'attributes' && record.target instanceof HTMLImageElement) display(record.target);
      for (const node of record.addedNodes) {
        if (!(node instanceof Element)) continue;
        if (node instanceof HTMLImageElement) display(node);
        else node.querySelectorAll('img[src]').forEach(display);
      }
    }
  }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
})();
