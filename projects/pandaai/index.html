<script>
(() => {
  async function readPortfolioEntry(url, { background = false } = {}) {
  // A response can send its headers and then stop delivering the HTML body.
  // Keep the first attempt while bytes are arriving, and retry a stuck transfer once.
  for (const cache of ['default', 'reload']) {
    const controller = new AbortController();
    let timeout;
    const arm = delay => {
      clearTimeout(timeout);
      timeout = setTimeout(() => controller.abort(), delay);
    };

    try {
      arm(cache === 'reload' ? 10000 : 4500);
      const response = await fetch(url, {
        cache,
        signal: controller.signal,
        priority: background ? 'low' : 'high',
      });
      if (!response.ok) throw new Error('Portfolio document unavailable');
      const reader = response.body.getReader();
      const chunks = [];
      let length = 0;
      while (true) {
        arm(cache === 'reload' ? 6500 : 3500);
        const next = await reader.read();
        if (next.done) break;
        chunks.push(next.value);
        length += next.value.byteLength;
      }
      const bytes = new Uint8Array(length);
      let position = 0;
      for (const chunk of chunks) {
        bytes.set(chunk, position);
        position += chunk.byteLength;
      }
      return bytes;
    } catch (error) {
      if (cache === 'reload' || background) throw error;
    } finally {
      clearTimeout(timeout);
    }
  }
}

  const variants=[{"resources": ["/assets/index-BtTUqiWb-pages-live.js?v=pages-native-4", "/assets/index-D-bYn1Q5.css", "/reference-sites/foreword-frames/player.js?v=pages-native-2"], "path": "/__entries/panda-desktop.html"}, {"resources": ["/assets/index-B4cBenVn-pages-live.js?v=pages-native-4", "/assets/pixel-city-renderer-CcLwTB12.js", "/assets/src-4DghefQ5.js", "/assets/src-_UQREVRZ.css", "/assets/index-CJiVI02r.css", "/reference-sites/foreword-frames/player.js?v=pages-native-2"], "path": "/__entries/panda-mobile.html"}];
  const mobile=/iPhone|iPad|Android|Mobile/i.test(navigator.userAgent);
  const selected=variants[mobile&&variants.length===2?1:0];
  const serviceWorker=navigator.serviceWorker;
  const startingHead=document.head;
  const workerReady=new Promise(resolve=>{
    if(!serviceWorker||serviceWorker.controller){resolve();return;}
    const finish=()=>{
      serviceWorker.removeEventListener('controllerchange',finish);
      resolve();
    };
    serviceWorker.addEventListener('controllerchange',finish,{once:true});
    serviceWorker.register('/_pages-worker.js',{scope:'/'}).catch(finish);
  });
  const transportReady=new Promise(resolve=>{
    const timer=setTimeout(resolve,2000);
    workerReady.then(()=>{clearTimeout(timer);resolve();});
  });
  window.__portfolioTransportReady=transportReady;
  if(selected.path){
    window.__portfolioEntryDocument=readPortfolioEntry(selected.path).then(bytes=>new TextDecoder().decode(bytes));
    window.__portfolioEntryDocument.catch(()=>{});
  }
  for(const url of selected.resources){
    const module=new URL(url,location.href).pathname.endsWith('.js');
    const element=document.createElement('link');
    element.href=url;
    element.crossOrigin='anonymous';
    if(module){
      element.rel='modulepreload';
    }else{
      element.rel='preload';
      element.as='style';
    }
    workerReady.then(()=>{if(document.head===startingHead)startingHead.appendChild(element);});
  }
})();
</script>

<script>(async () => {
  function mount(html) {
    document.open();
    document.write(html);
    document.close();
  }

  try {
    if (window.__portfolioEntryDocument) {
      // Mount the selected original document at the existing address.
      const entry = window.__portfolioEntryDocument;
      delete window.__portfolioEntryDocument;
      const [html] = await Promise.all([entry, window.__portfolioTransportReady]);
      mount(html);
      return;
    }
    const embedded = document.getElementById('pages-entries');
    if (embedded) {
      const device = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent) ? 1 : 0;
      const original = JSON.parse(embedded.textContent)[device];
      await window.__portfolioTransportReady;
      setTimeout(() => mount(original), 0);
      return;
    }
    if (!navigator.serviceWorker) throw new Error('Service workers unavailable');
    if (document.currentScript?.hasAttribute('data-fallback') &&
        !/^\/(hk(?:\/|$)|en(?:\/|$)|docs(?:\/|$)|agent_quant(?:\/|$)|tqx(?:-|\.|Api))/.test(location.pathname)) {
      throw new Error('Unknown entry');
    }
    await navigator.serviceWorker.register('/_pages-worker.js', { scope: '/' });
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise(resolve => {
        navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
        if (navigator.serviceWorker.controller) resolve();
      });
    }
    const html = await fetch(location.href).then(response => {
      if (!response.ok) throw new Error('Entry request failed');
      return response.text();
    });
    mount(html);
  } catch {
    const link = document.createElement('a');
    link.href = 'https://e1fc82ea.zhangqinkang.pages.dev' + location.pathname + location.search + location.hash;
    link.textContent = '打开首发作品集';
    document.body.append(link);
  }
})();
