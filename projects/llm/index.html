function prepareColdAssets(resources, transfer, signal) {
  return Promise.all(resources.map(async resource => {
    try {
      const {bytes, source} = await transfer(resource.url, resource.mirror, resource.digest, 350, resource.pack, signal);
      return {...resource, text:new TextDecoder().decode(bytes), source};
    } catch {
      return resource;
    }
  }));
}

function raceColdStartup(entry, assets, archive, resources, transfer, standardTransfer, archiveDelay) {
  let ready = false;
  const archiveTransfer = new AbortController();
  const standard = Promise.all([entry, assets]).then(([html, assets]) => ({html, assets}));
  const verified = standard.then(delivery => {
    if (delivery.assets.some(asset => asset.text === undefined)) {
      throw new Error('Project startup needs the archive');
    }
    ready = true;
    archiveTransfer.abort();
    return delivery;
  });
  const packaged = new Promise(resolve => setTimeout(resolve, archiveDelay)).then(async () => {
    if (ready) throw new Error('Project startup already available');
    const request = new Request(archive.path, {priority:'high'});
    const {bytes, source} = await transfer(request, archive.mirror, archive.digest, 300, undefined, archiveTransfer.signal);
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const delivery = await new Response(stream).json();
    if (typeof delivery.html !== 'string') throw new Error('Missing original project document');
    const assets = resources.map(resource => {
      const text = delivery.sources[resource.url];
      if (typeof text !== 'string') throw new Error('Missing original project resource');
      return {...resource, text, source:`archive-${source}`};
    });
    standardTransfer.abort();
    return {html:delivery.html, assets};
  });
  return Promise.any([verified, packaged]).catch(() => standard);
}

async function mountColdDocument(html, pending) {
  if (!pending) return false;
  const assets = await pending;
  if (!assets.some(asset => asset.text !== undefined)) return false;
  const tags = new Map();
  const annotated = html.replace(/<(script|link)\b[^>]*>/gi, tag => {
    const url = tag.match(/\b(?:src|href)="([^"]+)"/)?.[1];
    const asset = assets.find(entry => entry.url === url);
    if (!asset) return tag;
    if (asset.kind === 'dependency' && asset.text !== undefined &&
        /\brel="modulepreload"/.test(tag) && HTMLScriptElement.supports?.('importmap')) return '';
    if (asset.kind === 'dependency' || (asset.kind === 'module'
      ? !/\btype="module"/.test(tag) : !/\brel="stylesheet"/.test(tag))) return tag;
    tags.set(asset.url, asset);
    return asset.kind === 'module'
      ? `<script type="application/x-portfolio-module" data-portfolio-cold="${asset.url}">`
      : `<style data-portfolio-cold="${asset.url}"></style>`;
  });
  if (assets.some(asset => asset.kind !== 'dependency' && !tags.has(asset.url))) return false;

  document.open();
  document.write(annotated);
  document.close();

  if (HTMLScriptElement.supports?.('importmap')) {
    const imports = {};
    for (const asset of assets) {
      if (asset.kind !== 'dependency' || asset.text === undefined) continue;
      imports[new URL(asset.url, location.href).href] = URL.createObjectURL(new Blob(
        [coldModuleSource(asset)], {type:'text/javascript'}
      ));
    }
    if (Object.keys(imports).length) {
      const map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({imports});
      document.head.appendChild(map);
    }
  }

  const styles = [];
  const modules = [];
  for (const marker of document.querySelectorAll('[data-portfolio-cold]')) {
    const asset = tags.get(marker.dataset.portfolioCold);
    if (asset.kind === 'module') {
      modules.push([marker,asset]);
    } else if (asset.text !== undefined) {
      marker.textContent = asset.text;
    } else {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.crossOrigin = 'anonymous';
      styles.push(new Promise(resolve => {
        link.onload = link.onerror = resolve;
      }));
      link.href = asset.url;
      marker.replaceWith(link);
    }
  }
  await Promise.all(styles);
  for (const [marker,asset] of modules) {
    const script = document.createElement('script');
    script.type = 'module';
    script.async = false;
    if (asset.text === undefined) {
      script.crossOrigin = 'anonymous';
      script.src = asset.url;
    } else {
      script.textContent = coldModuleSource(asset);
      script.dataset.portfolioAssetSource = asset.source;
    }
    marker.replaceWith(script);
  }
  return true;
}

function coldModuleSource(asset) {
  const moduleURL = new URL(asset.url, location.href).href;
  const source = asset.text.replace(/(\b(?:from|import)\s*)(["'])(\.[^"']+)\2/g,
    (match, prefix, quote, path) => `${prefix}${quote}${new URL(path, moduleURL).href}${quote}`);
  // Vite's dependency preloader resolves against the original module URL.
  return source.replace('import.meta.resolve?import.meta.resolve(e):new URL(e,import.meta.url).href',
    `new URL(e,${JSON.stringify(moduleURL)}).href`);
}
async function prepareSharedPandaScan(resource, transfer) {
  if (typeof DecompressionStream !== 'function') return null;
  const urls = new Map();
  try {
    const {bytes} = await transfer(resource.path, resource.mirror, resource.digest, 350, resource.pack);
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const modules = await new Response(stream).json();
    const build = path => {
      if (urls.has(path)) return urls.get(path);
      const source = modules[path];
      if (typeof source !== 'string') throw new Error('Missing scan module');
      const url = new URL(path, location.origin);
      const rewritten = source.replace(/(\b(?:from|import)\s*)(["'])(\.\/[^"']+)\2/g,
        (match, prefix, quote, relative) => `${prefix}${quote}${build(new URL(relative, url).pathname)}${quote}`);
      const objectUrl = URL.createObjectURL(new Blob([rewritten], {type:'text/javascript'}));
      urls.set(path, objectUrl);
      return objectUrl;
    };
    return build('/panda-original/scanning-hero.js');
  } catch {
    for (const url of urls.values()) URL.revokeObjectURL(url);
    return null;
  }
}

(() => {
  async function collectPortfolioBytes(response, beforeRead) {
  const reader = response.body.getReader();
  const chunks = [];
  let length = 0;
  while (true) {
    beforeRead();
    const next = await reader.read();
    if (next.done) break;
    chunks.push(next.value);
    length += next.value.byteLength;
  }
  const bytes = new Uint8Array(length);
  let position = 0;
  for (const chunk of chunks) {
    bytes.set(chunk, position);
    position += chunk.byteLength;
  }
  return bytes;
}

async function readPortfolioEntry(url) {
  // A response can send its headers and then stop delivering the HTML body.
  // Keep the first attempt while bytes are arriving, and retry a stuck transfer once.
  for (const cache of ['default', 'reload']) {
    const controller = new AbortController();
    let timeout;
    const arm = delay => {
      clearTimeout(timeout);
      timeout = setTimeout(() => controller.abort(), delay);
    };

    try {
      arm(cache === 'reload' ? 10000 : 4500);
      const response = await fetch(url, {
        cache,
        signal: controller.signal,
        priority: 'high',
      });
      if (!response.ok) throw new Error('Portfolio document unavailable');
      return await collectPortfolioBytes(response, () => arm(cache === 'reload' ? 6500 : 3500));
    } catch (error) {
      if (cache === 'reload') throw error;
    } finally {
      clearTimeout(timeout);
    }
  }
}

async function verifyPortfolioBytes(bytes, expected) {
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  const checksum = Array.from(digest, byte => byte.toString(16).padStart(2, '0')).join('');
  if (checksum !== expected) throw new Error('Portfolio resource changed');
  return bytes;
}

async function readPortfolioPack(pack, signal, expected) {
  const chunks = await Promise.all(Array.from({ length: pack.parts }, async (_, index) => {
    const url = new URL(pack.path + index + '.bin', location.origin);
    for (const cache of ['default', 'reload']) {
      const controller = new AbortController();
      const abort = () => controller.abort();
      signal.addEventListener('abort', abort, { once: true });
      let idle;
      const arm = delay => {
        clearTimeout(idle);
        idle = setTimeout(abort, delay);
      };
      try {
        if (signal.aborted) throw signal.reason;
        arm(cache === 'reload' ? 3900 : 2600);
        const response = await fetch(url, { cache, signal: controller.signal, priority: 'high' });
        if (!response.ok) throw new Error('Portfolio part unavailable');
        return await collectPortfolioBytes(response, () => arm(2300));
      } catch (error) {
        if (cache === 'reload' || signal.aborted) throw error;
      } finally {
        clearTimeout(idle);
        signal.removeEventListener('abort', abort);
      }
    }
  }));
  const stream = new Blob(chunks).stream().pipeThrough(new DecompressionStream('gzip'));
  return verifyPortfolioBytes(await new Response(stream).arrayBuffer(), expected);
}

async function racePortfolioBytes(input, mirror, expected, hedgeDelay = 650, pack, signal) {
  const primary = new AbortController();
  const backup = new AbortController();
  const split = new AbortController();
  const cancel = () => {
    primary.abort();
    backup.abort();
    split.abort();
  };

  let launchBackup;
  const headStart = new Promise(resolve => { launchBackup = resolve; });

  const deadline = setTimeout(() => {
    primary.abort();
    backup.abort();
    split.abort();
  }, 12000);
  let splitTimer;
  let lastProgress = 0;

  async function verify(url, options, controller, source) {
    let idle;
    const arm = delay => {
      clearTimeout(idle);
      idle = setTimeout(() => controller.abort(), delay);
    };
    try {
      arm(5500);
      const response = await fetch(url, { ...options, signal: controller.signal });
      if (!response.ok) throw new Error('Portfolio resource unavailable');
      const bytes = await verifyPortfolioBytes(await collectPortfolioBytes(response, () => {
        lastProgress = performance.now();
        arm(4000);
      }), expected);
      return { bytes, source };
    } finally {
      clearTimeout(idle);
    }
  }

  try {
    signal?.throwIfAborted();
    const original = verify(input, {}, primary, 'origin').catch(error => {
      launchBackup();
      throw error;
    });
    const alternate = headStart.then(() => verify(mirror, {
      mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer',
    }, backup, 'mirror'));
    const choices = [original, alternate];
    if (pack && typeof DecompressionStream === 'function') {
      const wait = new Promise(resolve => {
        const started = performance.now();
        const check = () => {
          const now = performance.now();
          // A healthy transfer gets to finish without competing with its own parts.
          if (now - lastProgress < 450 && now - started < 2100) {
            splitTimer = setTimeout(check, 450);
          } else {
            resolve();
          }
        };
        splitTimer = setTimeout(check, 1250);
      });
      choices.push(wait.then(async () => ({
        bytes: await readPortfolioPack(pack, split.signal, expected), source: 'segments',
      })));
    }
    return await Promise.any(choices);
  } finally {
    clearTimeout(hedge);
    clearTimeout(deadline);
    clearTimeout(splitTimer);
    signal?.removeEventListener('abort', cancel);
    cancel();
  }
}
