function prepareColdAssets(resources, transfer, signal) {

    try {
      const {bytes, source} = await transfer(resource.url, resource.mirror, resource.digest, 350, resource.pack, signal);
      return {...resource, text:new TextDecoder().decode(bytes), source};
    } catch {

    }
  }));

async function mountColdDocument(html, pending) {

      ? !/\btype="module"/.test(tag) : !/\brel="stylesheet"/.test(tag))) return tag;

      ? `<script type="application/x-portfolio-module" data-portfolio-cold="${asset.url}">`

        [coldModuleSource(asset)], {type:'text/javascript'}

      const map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({imports});
      document.head.appendChild(map);
    }
  }

  const modules = [];
  for (const marker of document.querySelectorAll('[data-portfolio-cold]')) {
    const asset = tags.get(marker.dataset.portfolioCold);
    if (asset.kind === 'module') {
      modules.push([marker,asset]);
    } else if (asset.text !== undefined) {
      marker.textContent = asset.text;
    } else {

      link.rel = 'stylesheet';
      link.crossOrigin = 'anonymous';

      script.src = asset.url;
    } else {
      script.textContent = coldModuleSource(asset);
      script.dataset.portfolioAssetSource = asset.source;
    }

function coldModuleSource(asset) {
  const moduleURL = new URL(asset.url, location.href).href;
  const source = asset.text.replace(/(\b(?:from|import)\s*)(["'])(\.[^"']+)\2/g,
    (match, prefix, quote, path) => `${prefix}${quote}${new URL(path, moduleURL).href}${quote}`);

  return source.replace('import.meta.resolve?import.meta.resolve(e):new URL(e,import.meta.url).href',

(() => {
  async function collectPortfolioBytes(response, beforeRead) {
  const reader = response.body.getReader();
  const chunks = [];
  let length = 0;
  while (true) {
    beforeRead(length);
    const next = await reader.read();
    if (next.done) break;
    chunks.push(next.value);
    length += next.value.byteLength;
  }
  const bytes = new Uint8Array(length);
  let position = 0;
  for (const chunk of chunks) {
    bytes.set(chunk, position);
    position += chunk.byteLength;
  }
  return bytes;
}

async function readPortfolioEntry(url) {
  // A response can send its headers and then stop delivering the HTML body.
  // Keep the first attempt while bytes are arriving, and retry a stuck transfer once.
  for (const cache of ['default', 'reload']) {
    const controller = new AbortController();
    let timeout;
    const arm = delay => {
      clearTimeout(timeout);
      timeout = setTimeout(() => controller.abort(), delay);
    };

    try {
      arm(cache === 'reload' ? 10000 : 4500);
      const response = await fetch(url, {
        cache,
        signal: controller.signal,
        priority: 'high',
      });
      if (!response.ok) throw new Error('Portfolio document unavailable');
      return await collectPortfolioBytes(response, () => arm(cache === 'reload' ? 6500 : 3500));
    } catch (error) {
      if (cache === 'reload') throw error;
    } finally {
      clearTimeout(timeout);
    }
  }
}

async function verifyPortfolioBytes(bytes, expected) {
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  const checksum = Array.from(digest, byte => byte.toString(16).padStart(2, '0')).join('');
  if (checksum !== expected) throw new Error('Portfolio resource changed');
  return bytes;
}

    const url = new URL(pack.path + index + '.bin', location.origin);
    for (const cache of ['default', 'reload']) {
      const controller = new AbortController();
      const abort = () => controller.abort();
      signal.addEventListener('abort', abort, { once: true });
      let idle;
      const arm = delay => {
        clearTimeout(idle);
        idle = setTimeout(abort, delay);
      };
      try {
        if (signal.aborted) throw signal.reason;
        arm(cache === 'reload' ? 3900 : 2600);
        const response = await fetch(url, { cache, signal: controller.signal, priority: 'high' });
        if (!response.ok) throw new Error('Portfolio part unavailable');
        return await collectPortfolioBytes(response, () => arm(2300));
      } catch (error) {
        if (cache === 'reload' || signal.aborted) throw error;

        clearTimeout(idle);
