(() => {

  const mobile=/iPhone|iPad|Android|Mobile/i.test(navigator.userAgent);
  const selected=variants[mobile&&variants.length===2?1:0];
  const receive=async()=>{
    let response=await fetch(selected.entry);
    if(!response.ok)response=await fetch(selected.entry,{cache:'reload'});
    if(!response.ok)throw new Error('Portfolio entry '+response.status);
    return response.text();
  };
  const html=receive();
  const styles=[];
  for(const url of selected.resources){
    const module=new URL(url,location.href).pathname.endsWith('.js');
    const element=document.createElement('link');
    element.href=url;
    element.crossOrigin='anonymous';
    if(module){
      element.rel='modulepreload';
    }else{
      element.rel='preload';
      element.as='style';
      styles.push(new Promise(resolve=>{
        element.addEventListener('load',resolve,{once:true});
        element.addEventListener('error',resolve,{once:true});
      }));
    }
    document.head.appendChild(element);
  }
  if(selected.chapterPack){
    window.__portfolioTqxSourcesPromise??=fetch(selected.chapterPack,{priority:'low'})
      .then(response=>response.ok?response.json():null).catch(()=>null);
  }
  window.__portfolioColdEntry=Promise.all([html,...styles]);
  window.__portfolioColdEntry.catch(()=>{});
})();

</main></div><script>(async () => {
  function mount(html) {
    document.open();
    document.write(html);
    document.close();
  }

  try {
    const opening = document.getElementById('portfolio-opening');
    if (opening) {
      opening.addEventListener('click', event => {
        const link = event.target.closest('a[href^="#"]');
        if (link) window.__portfolioOpeningTarget = link.dataset.liveTarget || link.hash;
      });
    }
    const selected = window.__portfolioColdEntry;
    if (selected) {
      const [html] = await selected;
      if (!window.__portfolioOpeningTarget && document.getElementById('opening-projects') && scrollY > innerHeight * .4) {
        window.__portfolioOpeningTarget = '#jack-showcase';
      }
      delete window.__portfolioColdEntry;
      mount(html);
      return;
    }

    if (!navigator.serviceWorker) throw new Error('Service workers unavailable');
    if (document.currentScript?.hasAttribute('data-fallback') &&
        !/^\/(hk(?:\/|$)|en(?:\/|$)|docs(?:\/|$)|agent_quant(?:\/|$)|tqx(?:-|\.|Api))/.test(location.pathname)) {
      throw new Error('Unknown entry');
    }
    await navigator.serviceWorker.register('/_pages-worker.js', { scope: '/' });
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise(resolve => {
        navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
        if (navigator.serviceWorker.controller) resolve();
      });
    }
    const html = await fetch(location.href).then(response => {
      if (!response.ok) throw new Error('Entry request failed');
      return response.text();
    });
    mount(html);
  } catch {
    const link = document.createElement('a');
    link.href = 'https://e1fc82ea.zhangqinkang.pages.dev' + location.pathname + location.search + location.hash;
    link.textContent = '打开首发作品集';
    document.body.append(link);
  }
})();
</script>
