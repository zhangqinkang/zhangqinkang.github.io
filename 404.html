<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>张勤康 · 作品集</title>
<style>html{background:#0a0a0a;color:#fff}body{margin:0}a{color:inherit}</style>

<body>
<script data-fallback>(async () => {
  function mount(html) {
    document.open();
    document.write(html);
    document.close();
  }

  try {
    if (window.__portfolioEntryDocument) {
      // Mount the selected original document at the existing address.
      const entry = window.__portfolioEntryDocument;
      delete window.__portfolioEntryDocument;
      mount(await entry);
      return;
    }
    const embedded = document.getElementById('pages-entries');
    if (embedded) {
      const device = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent) ? 1 : 0;
      const original = JSON.parse(embedded.textContent)[device];
      setTimeout(() => mount(original), 0);
      return;
    }
    if (!navigator.serviceWorker) throw new Error('Service workers unavailable');
    if (document.currentScript?.hasAttribute('data-fallback') &&
        !/^\/(hk(?:\/|$)|en(?:\/|$)|docs(?:\/|$)|agent_quant(?:\/|$)|tqx(?:-|\.|Api))/.test(location.pathname)) {
      throw new Error('Unknown entry');
    }
    await navigator.serviceWorker.register('/_pages-worker.js', { scope: '/' });
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise(resolve => {
        navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
        if (navigator.serviceWorker.controller) resolve();
      });
    }
    const html = await fetch(location.href).then(response => {
      if (!response.ok) throw new Error('Entry request failed');
      return response.text();
    });
    mount(html);
  } catch {
    const link = document.createElement('a');
    link.href = 'https://e1fc82ea.zhangqinkang.pages.dev' + location.pathname + location.search + location.hash;
    link.textContent = '打开首发作品集';
    document.body.append(link);
  }
})();
</script>
<noscript>请启用 JavaScript。<a href="https://e1fc82ea.zhangqinkang.pages.dev/">打开首发作品集</a></noscript>
</html>
